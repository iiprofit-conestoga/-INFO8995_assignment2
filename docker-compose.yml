version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - PORT=${PORT}  # Pass the port to the Dockerfile
    restart: always
    env_file:
      - .env
    expose:
      - "${PORT}"  # Only expose port internally (no external binding)
    depends_on:
      - db
    volumes:
      - logs_volume:/app/logs  # Persistent logs storage
    networks:
      - app_network
    deploy:
      replicas: 3  # Run 3 instances of the backend
      restart_policy:
        condition: on-failure

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  reverse-proxy:
    image: nginx:latest
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  logs_volume:  # Named volume for logs