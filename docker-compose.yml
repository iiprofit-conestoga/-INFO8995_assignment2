version: '3.8'

services:
  web:
    build:
      context: .
      args:
        - PORT=${PORT}  # Pass the port to the Dockerfile
    restart: always
    env_file:
      - .env
    expose:
      - "${PORT}"  # Only expose port internally (no external binding)
    depends_on:
      db:
        condition: service_healthy  # Wait for db to be healthy
    volumes:
      - logs_volume:/app/logs  # Persistent logs storage
    networks:
      - app_network
    deploy:
      replicas: 3  # Run 3 instances of the backend
      restart_policy:
        condition: on-failure
    environment:
      - PORT=${PORT}  # Make sure PORT is passed to the container

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:       # Add healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  reverse-proxy:
    image: nginx:latest
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    depends_on:
      - web
    networks:
      - app_network
    environment:
      - PORT=${PORT}
    command: /bin/bash -c "envsubst '$$PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  logs_volume:  # Named volume for logs